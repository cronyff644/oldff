
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Under Maintenance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 600px;
    width: 100%;
}

.icon {
    font-size: 75px;
    margin-bottom: 25px;
    animation: rotate 5s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

h1 {
    font-size: 38px;
    margin-bottom: 15px;
    color: #ffffff;
}

h1 span {
    color: #00bfff;
}

p {
    color: #aab4c5;
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.status {
    display: inline-block;
    background: rgba(0,191,255,0.12);
    border: 1px solid #00bfff;
    color: #00bfff;
    padding: 9px 20px;
    border-radius: 30px;
    font-size: 13px;
    margin-bottom: 25px;
}

.progress {
    width: 100%;
    height: 7px;
    background: #202b3d;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-bar {
    width: 65%;
    height: 100%;
    background: linear-gradient(90deg, #007bff, #00d4ff);
    border-radius: 20px;
    animation: loading 2s ease-in-out infinite alternate;
}

@keyframes loading {
    from { width: 45%; }
    to { width: 85%; }
}

.small {
    font-size: 13px;
    color: #718096;
}

.footer {
    margin-top: 55px;
    font-size: 12px;
    color: #64748b;
}

@media(max-width: 480px) {
    h1 {
        font-size: 29px;
    }

    p {
        font-size: 14px;
    }

    .icon {
        font-size: 60px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">⚙️</div>

    <div class="status">
        ● UNDER MAINTENANCE
    </div>

    <h1>We'll Be <span>Back Soon!</span></h1>

    <p>
        We're currently working on improving our website
        to provide you with a better experience.
        Our website will be back online shortly.
    </p>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="small">
        Website improvement in progress...
    </div>

    <div class="footer">
        © 2026 Your Website Name. All Rights Reserved.
    </div>

</div>

</body>
</html>
